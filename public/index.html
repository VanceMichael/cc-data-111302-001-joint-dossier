<html lang="zh-CN"><meta charset="utf-8"><title>企业迁移联办门户的共用材料采集与分支续办</title><body><h1>企业迁移联办</h1><output id="profile"></output><input id="address" aria-label="迁入地址"><button id="revise">修订地址</button><button id="revoke">撤回医保授权</button><nav><button data-dept="registry">登记</button><button data-dept="medical">医保</button><button data-dept="housing">公积金</button></nav><section id="department"></section><pre id="receipt"></pre><script>
let current='registry'; let observation; const fields={};
async function render(){observation=await(await fetch('/state')).json();profile.textContent=JSON.stringify(observation.profile);department.replaceChildren();for(const name of observation.requirements[current]){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.name=name;input.value=observation.profile[name]||'';label.append(input);department.append(label);}const send=document.createElement('button');send.textContent='分发材料';send.id='send';send.onclick=async()=>{const values=Object.fromEntries([...department.querySelectorAll('input')].map(input=>[input.name,input.value]));const result=await fetch(`/department/${current}/receive`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({caseId:observation.caseId,profileVersion:observation.profile.version,consentVersion:observation.consents[current],fields:values,dispatchId:crypto.randomUUID()})});receipt.textContent=await result.text();};department.append(send);}
document.querySelectorAll('[data-dept]').forEach(button=>button.onclick=()=>{current=button.dataset.dept;render();});revise.onclick=async()=>{await fetch('/control',{method:'POST',body:JSON.stringify({address:address.value})});render();};revoke.onclick=async()=>{await fetch('/control',{method:'POST',body:JSON.stringify({revoke:'medical'})});render();};render();</script></body></html>
